name: Data Quality & Analytics CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-data-and-analysis:
    name: Veri Kalitesi ve Analiz Dogrulama (DQ)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: 1. Analiz Betigini Dogrula (src/analiz.py)
        run: |
          python src/analiz.py

      - name: 2. Veri Kalitesi Testlerini Kos (7 Senaryo)
        run: |
          python tests/test_veri_kalitesi.py
